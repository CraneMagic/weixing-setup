# 添加以下服务到 docker-compose.yml 中

  weixing-cv:
    image: yijun9124/weixing-cv:${TAG:-latest}
    container_name: weixing-cv
    hostname: weixing-cv
    restart: unless-stopped
    env_file:
      - .env
    user: "${UID}:${GID}"
    volumes:
      - ./temp:/app/data/images:rw          # 输入图像目录（从tcp-servers共享）
      - ./output:/app/output:rw             # 输出结果目录
      - ./logs:/app/logs:rw                 # 日志目录
      - ./baseline.mat:/app/baseline.mat:ro # 标定文件（只读）
    environment:
      - BASELINE_PATH=/app/baseline.mat
      - IMAGE_DIRECTORY=/app/data/images
      - IMAGE_SOURCE_MODE=docker_volume
      - CALIBRATION_MODE=auto
      - BACKEND_API_URL=http://backend-service:3000
    depends_on:
      - websocket-server
      - backend-service
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.50"
          memory: 512M
        limits:
          cpus: "1.00"
          memory: 2G
