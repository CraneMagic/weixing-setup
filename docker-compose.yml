services:
  postgres:
    image: postgres:15
    restart: always
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "0.50"
          memory: 1G
  websocket-server:
    image: yijun9124/weixing-websocket-server:${TAG:-latest}
    container_name: websocket-server
    hostname: websocket-server
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:${WS_PORT:-8080}"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - ./logs:/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # depends_on:
    #   - backend-service
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.15"
          memory: 128M
        limits:
          cpus: "0.30"
          memory: 512M
  udp-server:
    image: yijun9124/weixing-udp-server:${TAG:-latest}
    container_name: udp-server
    hostname: udp-server
    restart: unless-stopped
    ports:
      - "2000:2000/udp"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - ./data:/usr/src/app/data:rw
      - ./logs:/usr/src/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # depends_on:
    #   - backend-service
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 128M
        limits:
          cpus: "0.25"
          memory: 256M
  # tcp-server:
  #   image: yijun9124/weixing-tcp-server:${TAG:-latest}
  #   container_name: tcp-server
  #   hostname: tcp-server
  #   restart: unless-stopped
  #   ports:
  #     - "8999:8999"
  #   env_file:
  #     - .env
  #   user: "${UID}:${GID}"
  #   volumes:
  #     - ./data:/usr/src/app/data:rw
  #     - ./logs:/usr/src/app/logs:rw
  #     - ./error:/usr/src/app/error:rw
  #     - ./temp:/usr/src/app/temp:rw
  #   depends_on:
  #     - backend-service
  #     - websocket-server
  #   networks:
  #     - weixing-network
  tcp-server-1:
    image: yijun9124/weixing-tcp-server:${TAG:-latest}
    container_name: tcp-server-1
    hostname: tcp-server-1
    restart: unless-stopped
    ports:
      - "8999:8999"
    env_file:
      - .env
    environment:
      - CAMERA_ID=1
      - CAMERA_PORT=8999
      - CAMERA_NAME=camera1
      - BUFFER_SIZE=65536
      - THREAD_POOL_SIZE=4
      - TZ=Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - ./data:/usr/src/app/data:rw
      - ./logs:/usr/src/app/logs:rw
      - ./temp:/usr/src/app/temp:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - backend-service
      - websocket-server
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.30"
          memory: 256M
        limits:
          cpus: "0.60"
          memory: 1G
  tcp-server-2:
    image: yijun9124/weixing-tcp-server:${TAG:-latest}
    container_name: tcp-server-2
    hostname: tcp-server-2
    restart: unless-stopped
    ports:
      - "9000:8999"
    env_file:
      - .env
    environment:
      - CAMERA_ID=2
      - CAMERA_PORT=8999
      - CAMERA_NAME=camera2
      - BUFFER_SIZE=65536
      - THREAD_POOL_SIZE=4
      - TZ=Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - ./data:/usr/src/app/data:rw
      - ./logs:/usr/src/app/logs:rw
      - ./temp:/usr/src/app/temp:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - backend-service
      - websocket-server
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.30"
          memory: 256M
        limits:
          cpus: "0.60"
          memory: 1G
  tcp-server-3:
    image: yijun9124/weixing-tcp-server:${TAG:-latest}
    container_name: tcp-server-3
    hostname: tcp-server-3
    restart: unless-stopped
    ports:
      - "9001:8999"
    env_file:
      - .env
    environment:
      - CAMERA_ID=3
      - CAMERA_PORT=8999
      - CAMERA_NAME=camera3
      - BUFFER_SIZE=65536
      - THREAD_POOL_SIZE=4
      - TZ=Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - ./data:/usr/src/app/data:rw
      - ./logs:/usr/src/app/logs:rw
      - ./temp:/usr/src/app/temp:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - backend-service
      - websocket-server
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.30"
          memory: 256M
        limits:
          cpus: "0.60"
          memory: 1G
  backend-service:
    image: yijun9124/weixing-service:${TAG:-latest}
    container_name: backend-service
    hostname: backend-service
    user: "${UID}:${GID}"
    group_add:
      - dialout
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyUSB1:/dev/ttyUSB1"
    privileged: true
    env_file:
      - .env
    depends_on:
      - postgres
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://backend-service:3000/api/parameters",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.50"
          memory: 1G
        limits:
          cpus: "1.00"
          memory: 3G
  frontend:
    image: yijun9124/weixing-frontend:${TAG:-latest}
    container_name: frontend
    hostname: frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # depends_on:
    #   - backend-service
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  weixing-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
