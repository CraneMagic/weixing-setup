  #   networks:
  #     - weixing-network
  backend-service:
    image: yijun9124/weixing-service:${TAG:-latest}
    container_name: backend-service
    hostname: backend-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://backend-service:3000/api/parameters",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - weixing-network
  frontend:
    image: yijun9124/weixing-frontend:${TAG:-latest}
    container_name: frontend
    hostname: frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
    networks:
      - weixing-network

networks:
  weixing-network:
    driver: bridge
