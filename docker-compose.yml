# 内存配额按「单机约 8GB RAM」收敛：各服务 limits 合计约 ~6.2GB，留出头给系统与 Docker。
services:
  postgres:
    image: registry.yijunstudio.xyz/mirror/postgres:15
    restart: always
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 512M
  websocket-server:
    image: registry.yijunstudio.xyz/weixing-websocket-server:${TAG:-latest}
    container_name: websocket-server
    hostname: websocket-server
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:${WS_PORT:-8080}"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - ./logs:/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # depends_on:
    #   - backend-service
    networks:
      - weixing-network
    # 8GB 主机：给到 1.25G，比原 1G 更稳，又避免与 backend/cv 抢满内存
    deploy:
      resources:
        reservations:
          cpus: "0.20"
          memory: 384M
        limits:
          cpus: "0.60"
          memory: 1280M
  udp-server:
    image: registry.yijunstudio.xyz/weixing-udp-server:${TAG:-latest}
    container_name: udp-server
    hostname: udp-server
    restart: unless-stopped
    ports:
      - "2000:2000/udp"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      WEIXING_SERVICE_BASE_URL: http://backend-service:3000
      ECC_MODEL_PATH: ${ECC_MODEL_PATH:-}
    user: "${UID}:${GID}"
    volumes:
      - ./data:/usr/src/app/data:rw
      - ./logs:/usr/src/app/logs:rw
      - ./ecc_model.json:/usr/src/app/ecc_model.json:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # depends_on:
    #   - backend-service
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 128M
        limits:
          cpus: "0.25"
          memory: 256M
  # tcp-server:
  #   image: registry.yijunstudio.xyz/weixing-tcp-server:${TAG:-latest}
  #   container_name: tcp-server
  #   hostname: tcp-server
  #   restart: unless-stopped
  #   ports:
  #     - "8999:8999"
  #   env_file:
  #     - .env
  #   user: "${UID}:${GID}"
  #   volumes:
  #     - ./data:/usr/src/app/data:rw
  #     - ./logs:/usr/src/app/logs:rw
  #     - ./error:/usr/src/app/error:rw
  #     - ./temp:/usr/src/app/temp:rw
  #   depends_on:
  #     - backend-service
  #     - websocket-server
  #   networks:
  #     - weixing-network
  tcp-server-1:
    image: registry.yijunstudio.xyz/weixing-tcp-server:${TAG:-latest}
    container_name: tcp-server-1
    hostname: tcp-server-1
    restart: unless-stopped
    ports:
      - "8999:8999"
    env_file:
      - .env
    environment:
      - CAMERA_ID=1
      - CAMERA_PORT=8999
      - CAMERA_NAME=camera1
      - BUFFER_SIZE=65536
      - THREAD_POOL_SIZE=4
      - TZ=Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - ./data:/usr/src/app/data:rw
      - ./logs:/usr/src/app/logs:rw
      - ./temp:/usr/src/app/temp:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - backend-service
      - websocket-server
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.30"
          memory: 128M
        limits:
          cpus: "0.60"
          memory: 320M
  tcp-server-2:
    image: registry.yijunstudio.xyz/weixing-tcp-server:${TAG:-latest}
    container_name: tcp-server-2
    hostname: tcp-server-2
    restart: unless-stopped
    ports:
      - "9000:8999"
    env_file:
      - .env
    environment:
      - CAMERA_ID=2
      - CAMERA_PORT=8999
      - CAMERA_NAME=camera2
      - BUFFER_SIZE=65536
      - THREAD_POOL_SIZE=4
      - TZ=Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - ./data:/usr/src/app/data:rw
      - ./logs:/usr/src/app/logs:rw
      - ./temp:/usr/src/app/temp:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - backend-service
      - websocket-server
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.30"
          memory: 128M
        limits:
          cpus: "0.60"
          memory: 320M
  tcp-server-3:
    image: registry.yijunstudio.xyz/weixing-tcp-server:${TAG:-latest}
    container_name: tcp-server-3
    hostname: tcp-server-3
    restart: unless-stopped
    ports:
      - "9001:8999"
    env_file:
      - .env
    environment:
      - CAMERA_ID=3
      - CAMERA_PORT=8999
      - CAMERA_NAME=camera3
      - BUFFER_SIZE=65536
      - THREAD_POOL_SIZE=4
      - TZ=Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - ./data:/usr/src/app/data:rw
      - ./logs:/usr/src/app/logs:rw
      - ./temp:/usr/src/app/temp:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - backend-service
      - websocket-server
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.30"
          memory: 128M
        limits:
          cpus: "0.60"
          memory: 320M
  backend-service:
    image: registry.yijunstudio.xyz/weixing-service:${TAG:-latest}
    container_name: backend-service
    hostname: backend-service
    user: "${UID}:${GID}"
    group_add:
      - dialout
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      CV_SERVICE_URL: http://weixing-cv:3001
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyUSB1:/dev/ttyUSB1"
    privileged: true
    env_file:
      - .env
    depends_on:
      - postgres
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://backend-service:3000/api/parameters",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.40"
          memory: 512M
        limits:
          cpus: "1.00"
          memory: 1280M
  frontend:
    image: registry.yijunstudio.xyz/weixing-frontend:${TAG:-latest}
    container_name: frontend
    hostname: frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    user: "${UID}:${GID}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # depends_on:
    #   - backend-service
    networks:
      - weixing-network
    deploy:
      resources:
        reservations:
          cpus: "0.15"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 384M
  weixing-cv:
    image: registry.yijunstudio.xyz/weixing-cv:${TAG:-latest}
    container_name: weixing-cv
    hostname: weixing-cv
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    user: "${UID}:${GID}"
    volumes:
      - ./data/images:/app/data/images:rw
      - ./output:/app/output:rw
      - ./logs:/app/logs:rw
      - ./baseline.mat:/app/baseline.mat:ro
    environment:
      - BASELINE_PATH=/app/baseline.mat
      - CALIBRATION_SERVER_PORT=3001
      - IMAGE_DIRECTORY=/app/data/images
      - IMAGE_SOURCE_MODE=docker_volume
      - CALIBRATION_MODE=auto
      - BACKEND_API_URL=http://backend-service:3000
      - WS_URL=ws://websocket-server:8080
      - TZ=Asia/Shanghai
    depends_on:
      - websocket-server
      - backend-service
    networks:
      - weixing-network
    # 8GB 主机：适当减小 shm，仍满足常见 OpenCV/多进程需求
    shm_size: 256m
    # 日志配置，防止日志文件过大
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          cpus: "0.50"
          memory: 512M
        limits:
          cpus: "2.00"
          memory: 1536M

networks:
  weixing-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
