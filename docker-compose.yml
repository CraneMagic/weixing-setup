services:
  websocket-server:
    image: yijun9124/weixing-websocket-server:${TAG:-latest}
    container_name: websocket-server
    hostname: websocket-server
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:${WS_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - weixing-network
  udp-server:
    image: yijun9124/weixing-udp-server:${TAG:-latest}
    container_name: udp-server
    hostname: udp-server
    restart: unless-stopped
    ports:
      - "2000:2000/udp"
    env_file:
      - .env
    volumes:
      - ./data:/usr/src/app/data
      - ./logs:/usr/src/app/logs
    networks:
      - weixing-network
  tcp-server:
    image: yijun9124/weixing-tcp-server:${TAG:-latest}
    container_name: tcp-server
    hostname: tcp-server
    restart: unless-stopped
    ports:
      - "8999:8999"
    env_file:
      - .env
    volumes:
      - ./data:/usr/src/app/data
      - ./logs:/usr/src/app/logs
      - ./error:/usr/src/app/error
      - ./temp:/usr/src/app/temp
    networks:
      - weixing-network
